<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Hi, I'm Abhinav. Backend-leaning full stack engineer interested in GenAI, scalable systems and building impactful products.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.6" stop-color="#140f33"/>
      <stop offset="1" stop-color="#2a1550"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="820" cy="120" r="260" fill="url(#glow)"/>
    <circle cx="930" cy="250" r="160" fill="url(#glow2)"/>

    <!-- Left: text -->
    <text x="48" y="104" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f3f4f6">Hi, I'm <tspan fill="url(#name)">Abhinav</tspan></text>
    <text font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">
      <tspan x="48" y="150">Backend-leaning Full Stack Engineer</tspan>
      <tspan x="48" y="180">building GenAI platforms, scalable systems</tspan>
      <tspan x="48" y="210">and impactful products.</tspan>
    </text>
    <text x="48" y="262" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#2dd4bf">&gt;_<tspan fill="#2dd4bf">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>▌</tspan></text>

    <!-- Right: stylised dev desk -->
    <g transform="translate(600 28)">
      <rect x="40" y="10" width="330" height="200" rx="14" fill="#0b1224" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="2"/>
      <rect x="40" y="10" width="330" height="30" rx="14" fill="#141c36"/>
      <rect x="40" y="26" width="330" height="14" fill="#141c36"/>
      <circle cx="62" cy="25" r="5" fill="#f87171"/>
      <circle cx="80" cy="25" r="5" fill="#fbbf24"/>
      <circle cx="98" cy="25" r="5" fill="#34d399"/>
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
        <text x="62" y="68" fill="#a78bfa">class <tspan fill="#2dd4bf">Router</tspan> <tspan fill="#94a3b8">{</tspan></text>
        <text x="84" y="92" fill="#94a3b8">stream(<tspan fill="#fb923c">request</tspan>)</text>
        <text x="84" y="116" fill="#94a3b8">route(<tspan fill="#fb923c">model</tspan>)</text>
        <text x="84" y="140" fill="#94a3b8">publish(<tspan fill="#fb923c">kafka</tspan>)</text>
        <text x="62" y="164" fill="#94a3b8">}</text>
        <text x="62" y="192" fill="#2dd4bf">✓ <tspan fill="#cbd5e1">tests passed</tspan></text>
      </g>
      <rect x="185" y="210" width="40" height="22" fill="#141c36"/>
      <rect x="150" y="232" width="110" height="9" rx="4.5" fill="#1d2747"/>
      <!-- floating tags -->
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
        <rect x="-44" y="96" width="88" height="28" rx="14" fill="#0b1224" stroke="#2dd4bf" stroke-opacity="0.6"/>
        <text x="0" y="115" text-anchor="middle" fill="#2dd4bf">GenAI</text>
        <rect x="262" y="196" width="100" height="28" rx="14" fill="#0b1224" stroke="#fb923c" stroke-opacity="0.6"/>
        <text x="312" y="215" text-anchor="middle" fill="#fb923c">Spring Boot</text>
      </g>
    </g>
  </g>
</svg>
